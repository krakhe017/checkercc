<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Checker - Stripe & PayPal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://www.paypal.com/sdk/js?client-id={{ PAYPAL_CLIENT_ID }}&currency=USD"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>💳 Card Checker Pro</h1>
            <p class="subtitle">Selecciona el método de pago</p>
        </header>

        <!-- Pestañas para cambiar de pasarela -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('stripe', this)">Stripe</button>
            <button class="tab-btn" onclick="switchTab('paypal', this)">PayPal</button>
        </div>

        <!-- Formulario de Tarjeta (Común para ambos) -->
        <div id="card-form" class="card-form">
            <div class="input-group">
                <label>Número de Tarjeta</label>
                <input type="text" id="card-number" placeholder="4111 1111 1111 1111">
            </div>
            <div class="row">
                <div class="input-group">
                    <label>Mes (MM)</label>
                    <input type="text" id="card-mm" placeholder="12" maxlength="2">
                </div>
                <div class="input-group">
                    <label>Año (YYYY)</label>
                    <input type="text" id="card-yyyy" placeholder="2026" maxlength="4">
                </div>
                <div class="input-group">
                    <label>CVV</label>
                    <input type="text" id="card-cvv" placeholder="123" maxlength="4">
                </div>
            </div>
            <button id="start-btn" class="btn-primary" onclick="startCheck()">Iniciar Verificación</button>
        </div>

        <!-- Contenedor de Resultados -->
        <div id="result-container" class="result hidden">
            <h3>Resultado:</h3>
            <p id="result-message"></p>
        </div>

        <!-- Contenedor de PayPal (Oculto por defecto) -->
        <div id="paypal-container" class="hidden">
            <div id="paypal-button-container"></div>
        </div>
    </div>

    <script>
        let currentTab = 'stripe';
        const PAYPAL_CLIENT_ID = "{{ PAYPAL_CLIENT_ID }}";

        function switchTab(tab, element) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            if (tab === 'paypal') {
                document.getElementById('paypal-container').classList.remove('hidden');
                document.querySelector('.card-form').classList.add('hidden');
                renderPayPalButtons();
            } else {
                document.getElementById('paypal-container').classList.add('hidden');
                document.querySelector('.card-form').classList.remove('hidden');
            }
        }

        // --- LÓGICA STRIPE ---
        async function startCheck() {
            if (currentTab !== 'stripe') return;

            const card = document.getElementById('card-number').value.replace(/\s/g, '');
            const mm = document.getElementById('card-mm').value;
            const yyyy = document.getElementById('card-yyyy').value;
            const cvv = document.getElementById('card-cvv').value;

            if (!card || !mm || !yyyy || !cvv) return alert('Llena todos los campos');

            const btn = document.getElementById('start-btn');
            btn.disabled = true;
            btn.textContent = 'Procesando...';

            try {
                const res = await fetch('/process_stripe_payment', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ card, mm, yyyy, cvv })
                });
                const data = await res.json();
                showResult(data.status === 'success' ? 'Aprobada' : 'Rechazada', data.message);
            } catch (e) {
                showResult('Error', 'Error de conexión');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Iniciar Verificación';
            }
        }

        // --- LÓGICA PAYPAL ---
        function renderPayPalButtons() {
            document.getElementById('paypal-button-container').innerHTML = '';
            paypal.Buttons({
                createOrder: function(data, actions) {
                    return fetch('/api/paypal/create-order', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ amount: '2.50' })
                    }).then(res => res.json()).then(data => data.id);
                },
                onApprove: function(data, actions) {
                    return fetch('/api/paypal/capture-order', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ orderID: data.orderID })
                    }).then(res => res.json()).then(details => {
                        showResult('Aprobada', `Pago completado por ${details.payer.name.given_name}`);
                    });
                },
                onError: function(err) {
                    showResult('Error', 'Error en PayPal');
                }
            }).render('#paypal-button-container');
        }

        function showResult(status, message) {
            const container = document.getElementById('result-container');
            container.classList.remove('hidden');
            document.getElementById('result-message').textContent = `${status}: ${message}`;
        }
    </script>
</body>
</html>
